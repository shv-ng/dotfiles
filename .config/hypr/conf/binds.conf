$mainMod = SUPER

bind = $mainMod, SPACE, exec, rofi -show                                        
bind = $mainMod, Q, killactive                                                  
bind = $mainMod, A, exec, pavucontrol                                           
bind = $mainMod, T, togglefloating                                              
bind = $mainMod, F, fullscreen                                                  
bind = $mainMod, G, exec, toggle_gaps.sh                 
bind = $mainMod, S, togglesplit,                                                
bind = $mainMod, X, exec, dunstctl close                                        
bind = $mainMod, R, exec, set-theme.sh                                          
bind = $mainMod, L, exec, localsend
bind = $mainMod CTRL, D, exec, toggle_touchpad.sh
bind = $mainMod, Print, exec, grim "/home/shivang/Pictures/Screenshots/$(date +'%F_%T').png" && notify-send "Screenshot saved" "Screenshot saved in $HOME/Pictures/Screenshots/"
bind = , Print, exec, grim - | wl-copy && notify-send "Screenshot copied"
bind = $mainMod, B, exec, ghostty --title=popup -e open_browser.sh     
bind = $mainMod, RETURN, exec, ghostty -e tmux_sessionizer /home/shivang/       
bind = $mainMod CTRL, P, exec, ghostty --title=popup -e power_menu.sh  
bind = $mainMod, P, exec, systemctl hibernate

bind = $mainMod, H, movefocus, l                                                
bind = $mainMod, L, movefocus, r                                                
bind = $mainMod, K, movefocus, u                                                
bind = $mainMod, J, movefocus, d                                                

bind = $mainMod, 1, workspace, 1                                                
bind = $mainMod, 2, workspace, 2                                                
bind = $mainMod, 3, workspace, 3                                                
bind = $mainMod, 4, workspace, 4                                                
bind = $mainMod, 5, workspace, 5                                                
bind = $mainMod, 6, workspace, 6                                                
bind = $mainMod, 7, workspace, 7                                                
bind = $mainMod, 8, workspace, 8                                                
bind = $mainMod, 9, workspace, 9                                                
bind = $mainMod, 0, workspace, 0                                               

bind = $mainMod SHIFT, 1, movetoworkspace, 1                                    
bind = $mainMod SHIFT, 2, movetoworkspace, 2                                    
bind = $mainMod SHIFT, 3, movetoworkspace, 3                                    
bind = $mainMod SHIFT, 4, movetoworkspace, 4                                    
bind = $mainMod SHIFT, 5, movetoworkspace, 5                                    
bind = $mainMod SHIFT, 6, movetoworkspace, 6                                    
bind = $mainMod SHIFT, 7, movetoworkspace, 7                                    
bind = $mainMod SHIFT, 8, movetoworkspace, 8                                    
bind = $mainMod SHIFT, 9, movetoworkspace, 9                                    
bind = $mainMod SHIFT, 0, movetoworkspace, 0                                   

bind = $mainMod, mouse_down, workspace, e+1                                     
bind = $mainMod, mouse_up, workspace, e-1                                       

bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86AudioRaiseVolume, exec, amixer set Master playback 10%+
bind = , XF86AudioLowerVolume, exec,  amixer set Master playback 10%-
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec,pactl set-source-mute @DEFAULT_SOURCE@ toggle

bind = $mainMod SHIFT, M, movecurrentworkspacetomonitor, eDP-1
bind = $mainMod SHIFT, V, movecurrentworkspacetomonitor, VNC-1

bindm = $mainMod, mouse:272, movewindow                                         
bindm = $mainMod, mouse:273, resizewindow                                       

