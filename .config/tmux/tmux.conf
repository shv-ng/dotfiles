set-option -g message-command-style fg='#89b4fa',bg='#1e1e2e'
set-option -g message-style fg='#cdd6f4',bg='#1e1e2e'
set-option -g mode-keys vi
set-option -g mouse on
set-option -g prefix `
set-option -g base-index 1
set-option -g set-titles on
set-option -g status-bg default
set-option -g status-justify centre  
set-option -g status-keys vi
set-option -g status-position top
set-option -g status-left "#[fg=orange]#S "
set-option -g status-right "#[fg=yellow]#(acpi | cut -d ',' -f2)"
set-option -g status-style fg=white
set-window-option -g automatic-rename on
set-window-option -g renumber-windows on
set-window-option -g clock-mode-colour yellow
set-window-option -g mode-keys vi
set-window-option -g window-status-current-format ' #I:#W '
set-window-option -g window-status-current-style fg=blue,bold
set-window-option -g window-status-format ' #I:#W '
set-window-option -g window-status-style fg=white,dim

bind-key '`' send-keys '`'
bind-key - split-window -v
bind-key | split-window -h
bind-key [ copy-mode
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"
bind-key h select-pane -L  
bind-key j select-pane -D  
bind-key k select-pane -U  
bind-key l select-pane -R  
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel \; run "tmux show-buffer | wl-copy" 
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-c new-window
bind-key -n M-o last-window
bind-key -n M-n next-window
bind-key -n M-p previous-window
bind-key -n M-x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind-key -n C-f run tmux_sessionizer
